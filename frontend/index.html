<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="PREDIKTIA es una plataforma de investigación cuantitativa de fútbol. Versión de investigación: sin pronósticos certificados, cuotas ni recomendaciones de apuestas."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PREDIKTIA</title>
    <script>
      // Apply a saved light/dark preference before first paint (see src/hooks/useTheme.ts).
      try {
        var theme = localStorage.getItem('prediktia.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {
        /* storage unavailable: follow the system preference */
      }
    </script>
  </head>
  <body>
    <noscript>PREDIKTIA necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
