# Lock operacional (CI y scheduler C6): resolución exacta de requirements.txt, transitivas incluidas.
# Lo instalan los workflows ops-*.yml con `pip install --no-deps -r requirements.lock` y `pip check`.
# Plataforma objetivo: Linux x86_64 + CPython 3.12 (runner ubuntu-latest de GitHub Actions).
# NO regenerar desde un `pip freeze` de Windows: allí faltan dependencias solo de Linux (uvloop)
# y sobran las de Windows (tzdata, colorama).
# requirements.txt / requirements-dev.txt siguen siendo los rangos para desarrollo; este archivo no los sustituye.
#
# Regenerar (desde backend/, en un entorno Linux + Python 3.12 limpio, p. ej. contenedor python:3.12-slim):
#   python -m venv /tmp/lock && . /tmp/lock/bin/activate
#   pip install -r requirements.txt              # añadir `-c requirements.lock` para conservar las versiones actuales
#   pip check && pip freeze > requirements.lock  # y volver a poner esta cabecera
