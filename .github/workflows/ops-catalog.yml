# Scheduler operativo de Prediktia (C6), tarea "catalog": diaria a las 04:50 UTC.
# Fuente ÚNICA de ejecución. GitHub evalúa el cron en UTC; no depende de ninguna zona horaria local.
# Gate de encendido: no hace nada salvo que la variable del repositorio
# PREDIKTIA_SCHEDULER_ENABLED valga 'true' (y GitHub solo programa workflows de la rama por defecto).
# Secretos: solo se REFERENCIAN aquí; se cargan en GitHub en un paso aparte y autorizado.
name: ops-catalog

on:
  schedule:
    - cron: "50 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ops-catalog
  cancel-in-progress: false

jobs:
  tick:
    if: ${{ vars.PREDIKTIA_SCHEDULER_ENABLED == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      TZ: UTC
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PREDIKTIA_EXPECTED_DB_TARGET: ${{ secrets.PREDIKTIA_EXPECTED_DB_TARGET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --no-deps -r requirements.lock
      - run: pip check
      - run: python -m app.jobs.ops_tick catalog
