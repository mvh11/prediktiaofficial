name: diagnostic-c6-neon-rtt

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  measure:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install diagnostic DB client
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: "psycopg[binary]==3.3.6"

      - name: Measure C6 to Neon RTT
        shell: bash
        run: |
          python - <<'PY'
          import math
          import os
          import platform
          import statistics
          import time

          import psycopg
          from psycopg.conninfo import conninfo_to_dict

          SAMPLE_COUNT = 50
          database_url = os.environ["DATABASE_URL"]

          conninfo = conninfo_to_dict(database_url)
          host = (conninfo.get("host") or "").lower()

          if "pooler" in host:
              connection_mode = "POOLED"
          elif host:
              connection_mode = "DIRECT"
          else:
              connection_mode = "UNRESOLVED"

          started = time.perf_counter()
          conn = psycopg.connect(database_url, autocommit=True)
          connection_latency_ms = (
              time.perf_counter() - started
          ) * 1000.0

          try:
              with conn.cursor() as cur:
                  cur.execute("BEGIN READ ONLY")

                  cur.execute("SHOW transaction_read_only")
                  read_only = cur.fetchone()[0]

                  if str(read_only).lower() not in {
                      "on", "true", "1"
                  }:
                      raise RuntimeError(
                          "read-only diagnostic transaction "
                          "was not established"
                      )

                  cur.execute(
                      "SELECT ssl "
                      "FROM pg_catalog.pg_stat_ssl "
                      "WHERE pid = pg_catalog.pg_backend_pid()"
                  )
                  ssl_row = cur.fetchone()
                  ssl_active = bool(
                      ssl_row and ssl_row[0]
                  )

                  # Warm-up, not included in measurements.
                  cur.execute("SELECT 1")
                  cur.fetchone()

                  samples_ms = []

                  for _ in range(SAMPLE_COUNT):
                      t0 = time.perf_counter()

                      cur.execute("SELECT 1")
                      cur.fetchone()

                      samples_ms.append(
                          (
                              time.perf_counter() - t0
                          ) * 1000.0
                      )

                  cur.execute("ROLLBACK")

              ordered = sorted(samples_ms)

              def percentile(values, p):
                  k = (len(values) - 1) * p
                  lo = math.floor(k)
                  hi = math.ceil(k)

                  if lo == hi:
                      return values[lo]

                  return (
                      values[lo]
                      + (values[hi] - values[lo])
                      * (k - lo)
                  )

              print(
                  f"sample_count={len(samples_ms)}"
              )
              print(
                  "rtt_p50_ms="
                  f"{statistics.median(samples_ms):.3f}"
              )
              print(
                  "rtt_p95_ms="
                  f"{percentile(ordered, 0.95):.3f}"
              )
              print(
                  f"rtt_min_ms={min(samples_ms):.3f}"
              )
              print(
                  f"rtt_max_ms={max(samples_ms):.3f}"
              )
              print(
                  "connection_establishment_ms="
                  f"{connection_latency_ms:.3f}"
              )
              print(
                  f"python_version={platform.python_version()}"
              )
              print(
                  "runner_os="
                  f"{platform.system()} "
                  f"{platform.release()} "
                  f"{platform.machine()}"
              )
              print(
                  "ssl_active="
                  f"{'YES' if ssl_active else 'NO'}"
              )
              print(
                  f"connection_mode={connection_mode}"
              )
              print("application_data_read=NO")
              print("database_mutation=NO")
              print("scheduler_invoked=NO")
              print("secrets_exposed=NO")

          finally:
              conn.close()
          PY
